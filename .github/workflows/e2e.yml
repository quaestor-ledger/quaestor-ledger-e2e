name: e2e

on:
  push:
    branches: [main]
  pull_request:

# This repo is public, so the default token grant is worth being explicit
# about: the suites only ever read the checkout. Nothing here publishes, so
# no job needs more than `contents: read`. Declaring it at the top level means
# a future job inherits the floor instead of the repo-wide default.
permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser system dependencies (Firefox/WebKit need libs)
        run: npx playwright install-deps
      - name: Contract smoke (no browsers)
        run: npm run test:contract
      - name: Playwright (Chromium + Firefox + WebKit) and Puppeteer
        run: |
          npm run test:playwright
          npm run test:puppeteer

  selenium:
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-chromium:4.27.0
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --add-host=host.docker.internal:host-gateway
          --health-cmd="/opt/bin/check-grid.sh --host 0.0.0.0 --port 4444"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Selenium against the Grid service
        env:
          # The GitHub-hosted runner reaches the fixture on its own localhost;
          # the containerized browser reaches it through Docker's host gateway.
          SELENIUM_REMOTE_URL: http://localhost:4444
          SELENIUM_BROWSER_HOST: host.docker.internal
        run: npm run test:selenium
