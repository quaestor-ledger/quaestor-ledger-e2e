name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned browser engines and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Contract smoke
        run: npm run test:contract
      - name: Playwright and Puppeteer matrix
        run: |
          npm run test:playwright
          npm run test:puppeteer

  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      selenium:
        image: selenium/standalone-chromium:4.27.0
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --add-host=host.docker.internal:host-gateway
          --health-cmd="/opt/bin/check-grid.sh --host 0.0.0.0 --port 4444"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Selenium against the Grid service
        env:
          SELENIUM_REMOTE_URL: http://localhost:4444
          SELENIUM_BROWSER_HOST: host.docker.internal
        run: npm run test:selenium
