name: materialize audited lockfile update

on:
  push:
    branches:
      - agent/harden-e2e-ci-contracts
    paths:
      - .github/workflows/materialize-lockfile-hardening.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/harden-e2e-ci-contracts
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed transitive dependency update
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('package-lock.json')
          text = path.read_text()
          old = '''    "node_modules/ip-address": {
              "version": "10.2.0",
              "resolved": "https://registry.npmjs.org/ip-address/-/ip-address-10.2.0.tgz",
              "integrity": "sha512-/+S6j4E9AHvW9SWMSEY9Xfy66O5PWvVEJ08O0y5JGyEKQpojb0K0GKpz/v5HJ/G0vi3D2sjGK78119oXZeE0qA==",
          '''
          new = '''    "node_modules/ip-address": {
              "version": "10.4.0",
              "resolved": "https://registry.npmjs.org/ip-address/-/ip-address-10.4.0.tgz",
              "integrity": "sha512-oSK96Grm3aP6OrS263xVxbNDGVL7rzBtYdpGqlDG8iQdoenDoTs/nkki+DflYbAEE8Xl6o5YxhxlrKvI3nqKXQ==",
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one ip-address lockfile anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate lockfile and contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run test:contract
          npm audit --audit-level=high

      - name: Push the validated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          git commit -m 'chore(deps): update audited ip-address lock entry'
          git push origin HEAD:agent/harden-e2e-ci-contracts
