name: remediate-ip-address-lock

on:
  pull_request:
    paths:
      - "package-lock.json"
      - ".github/workflows/remediate-ip-address-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/harden-e2e-ci-contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Update only the permitted transitive ip-address patch
        shell: bash
        run: |
          set -euo pipefail
          npm update ip-address --package-lock-only --ignore-scripts
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const entry = lock.packages?.['node_modules/ip-address'];
          const version = entry?.version ?? '0.0.0';
          const [major, minor, patch] = version.split('.').map(Number);
          const secure = major > 10 || (major === 10 && (minor > 3 || (minor === 3 && patch >= 1)));
          if (!secure) {
            throw new Error(`expected ip-address >=10.3.1, got ${entry?.version ?? 'missing'}`);
          }
          console.log(`validated secure ip-address ${version}`);
          NODE
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Commit the regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already remediated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): update vulnerable ip-address lock entry'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
