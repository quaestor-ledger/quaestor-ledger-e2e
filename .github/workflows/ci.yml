name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contract

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Prove the lockfile installs without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Record the resolved dependency audit
        id: npm-audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          set +e
          npm audit --audit-level=high --json > artifacts/npm-audit.json
          status=$?
          set -e
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
      - name: Summarize high and critical advisories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/npm-audit.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          vulnerabilities = report.get('vulnerabilities', {})
          for package, detail in sorted(vulnerabilities.items()):
              severity = str(detail.get('severity', 'unknown'))
              if severity not in {'high', 'critical'}:
                  continue
              titles = []
              for source in detail.get('via', []):
                  if isinstance(source, dict) and source.get('title'):
                      titles.append(str(source['title']))
                  elif isinstance(source, str):
                      titles.append(source)
              fix = detail.get('fixAvailable')
              message = (
                  f"package={package}; severity={severity}; range={detail.get('range')}; "
                  f"direct={detail.get('isDirect')}; fixAvailable={fix}; "
                  f"via={'; '.join(titles) or 'transitive dependency'}"
              )
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              title = f"npm audit {package}".replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title={title}::{message}")
          metadata = report.get('metadata', {}).get('vulnerabilities', {})
          print(
              'npm audit counts: '
              + ', '.join(f"{key}={metadata.get(key, 0)}" for key in ('low', 'moderate', 'high', 'critical', 'total'))
          )
          PY
      - name: Upload the npm audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/npm-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Reject high and critical vulnerabilities in the resolved dependency graph
        shell: bash
        env:
          NPM_AUDIT_EXIT_CODE: ${{ steps.npm-audit.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$NPM_AUDIT_EXIT_CODE" = "0"

  chromium-drivers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Playwright Chromium
        run: npm run test:playwright
      - name: Puppeteer Chromium
        run: npm run test:puppeteer

  playwright-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - run: npm run test:firefox
      - run: npm run test:webkit

  selenium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start Selenium Grid
        run: npm run selenium:up
      - name: Selenium scenarios through RemoteWebDriver
        env:
          SELENIUM_REMOTE_URL: http://localhost:4444
          SELENIUM_BROWSER_HOST: host.docker.internal
        run: npm run test:selenium
      - name: Collect Selenium logs
        if: failure()
        run: docker compose -f docker-compose.selenium.yml logs --no-color
      - name: Stop Selenium Grid
        if: always()
        run: npm run selenium:down
